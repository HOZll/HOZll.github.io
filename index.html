<style>
html, body { margin: 0; padding: 0; background: #ffffff; font-family: Verdana, Geneva, sans-serif; }
*, *::before, *::after { box-sizing: border-box; }
.local-shell { max-width: 1140px; margin: 0 auto; padding: 10px 15px 40px; }
/* Basic Layout */
@media screen and (max-width: 760px) {

    body, html {
        width: 100%;
    }

    #layoutContainer {
        display: block;
    }

    #layoutMenucolumn {
        width: 100%;
        flex-basis: 100%;
        align-self: stretch;
    }

  #finalImageContainer {
    max-width: 600px;
    width: 100%;
    margin: 0 auto; 
}

    #optionscontainer {
        max-height: none;
        overflow: visible;
    }

    .preset-row {
        flex-direction: column;
        align-items: stretch;
    }

    .presetmenu,
    .loadbutton {
        width: 100%;
    }
}



#layoutMenucolumn {
    display: flex;
    flex-direction: column;
    width: 30%;
    min-width: 250px;
}

#tabmenu {
    display: flex;
    width: 100%;
}

.tabsection {
    flex: 1;
    border: none;
    outline: none;
    border-radius: 5px 5px 0 0;
    overflow: hidden;
}

#layoutContainer {
    display: flex;
    width: 100%;
    flex-wrap: wrap;
}

#layoutWrapper {
    flex: 1;
    position: relative;
    min-width: 300px;
}

#optionscontainer {
width: 100%;
max-height: 500px;
display: block;
overflow-y: scroll;
overflow-x: hidden;
}

/* Scrollbar Dynamic Styling per Tab */
#optionscontainer::-webkit-scrollbar {
  width: 10px;
}

#optionscontainer::-webkit-scrollbar-track {
  background: #f1f1f1;
}

#optionscontainer::-webkit-scrollbar-thumb {
  background: var(--scrollbar-color, #ffa6be);
  border-radius: 6px;
}

#optionscontainer::-webkit-scrollbar-thumb:hover {
  background: var(--scrollbar-color-hover, #ff8fab);
}


#tab1 img, #tab2 img, #tab3 img, #tab4 img, #tab5 img {
    max-width: 80%;
}


select:disabled,
input:disabled {
  opacity: 0.5;
  pointer-events: none;
}

select option {
padding: 5px;
}

#optionscontainer hr {
display: block;
text-align: left;
margin-left: 1px;
margin-top: 13px;
margin-bottom: 16px;
border-style: dashed;
border-color: #adadad;
border-width: 1px;
width: 70%;
}

#finalImageContainer {
  max-width: 600px;
  position: relative;
}

#canvasFinal {
  width: 100%;
  height: auto;
  display: block;
}

.preset-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
}

.presetmenu {
    flex: 1 1 200px;
}

.loadbutton {
    flex: 0 0 auto;
}

.input-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
}

.input-row select {
  max-width: 160px;
  min-width: 100px;
  width: auto;
  flex-shrink: 1;
}

.color-input-container {
  display: flex;
  align-items: center;
  gap: 6px;
}

.color-input-container input[type="text"] {
            margin-left: 5px;
            width: 80px;
            text-transform: uppercase;
            text-align: center;
        }

.utilitiesPanel {
border-width: 1px;
padding-top: 5px;
border-radius: 2px 2px 2px 2px;
}

.column {
  display: flex;
  flex-direction: column;
  flex: 1;
}

.column select {
text-align: left;
margin-left: 5px;
}
	  
.colorselector {
position:relative;
padding-left: 10px;
margin-left: 10px;
}

.finalImage {
max-width:600px;	
}


/* Confirmation Modal */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.5);
  z-index: 9999;
}

.modal-box {
  background: #222;
  color: #fff;
  padding: 20px 30px;
  border-radius: 12px;
  text-align: center;
  min-width: 280px;
}

.modal-buttons {
  margin-top: 15px;
  display: flex;
  justify-content: center;
  gap: 10px;
}

.modal-buttons button {
  padding: 6px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

#confirmYes {
  background: #4caf50;
  color: white;
}

#confirmNo {
  background: #777;
  color: white;
}



/* Loading Spinner */

#loadingScreen {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
text-align: center; 
    justify-content: center;
    align-items: center;
}

.loadingSpinner {
	position: relative;
   --d: 31.7px;
   width: 5.8px;
   height: 5.8px;
   border-radius: 50%;
   color: #47a4ff;
   box-shadow: calc(1*var(--d))      calc(0*var(--d))     0 0,
          calc(0.707*var(--d))  calc(0.707*var(--d)) 0 1.4px,
          calc(0*var(--d))      calc(1*var(--d))     0 2.9px,
          calc(-0.707*var(--d)) calc(0.707*var(--d)) 0 4.3px,
          calc(-1*var(--d))     calc(0*var(--d))     0 5.8px,
          calc(-0.707*var(--d)) calc(-0.707*var(--d))0 7.2px,
          calc(0*var(--d))      calc(-1*var(--d))    0 8.6px;
   animation: spinner-a90wxe 1s infinite steps(8);
}

@keyframes spinner-a90wxe {
   100% {
      transform: rotate(1turn);
   }
}

/* Menu Tabs */

#optionscontainer {
width: 100%;
display: block;
padding: 10px;
border-right-style: solid;
border-bottom-style: solid;
border-left-style: solid;
border-top-style: solid;
border-width: 5px;
border-color: #ffa6be;
border-radius: 0 0 8px 8px;
overflow: auto;
}

#optionscontainer h4 {
display: block;
line-height:100%;
font-size: 12px;
color: #969b9e;
}

#optionscontainer h3 {
line-height:100%;
font-size: 14px;
color: #161a1c;
}

#tab1 {
width: 20%;
background-color:#ffa6be;
color: #ffa6be;
}

#tab2 {
width: 20%;
background-color:#ffe4a6;
color: #ffe4a6;
}

#tab3 {
width: 20%;
background-color:#d3ffa6;
color: #d3ffa6;
}
	  
#tab4 {
width: 20%;
background-color:#a6ddff;
color: #a6ddff;
}

#tab5 {
width: 20%;
background-color:#e3a6ff;
color: #e3a6ff;
}
	  
#canvas {
  display: block;
  width: 100%;
  height: auto;
}


/* Buttons */

	  
.utilbutton {
  text-align: center;
  padding: 6px;
  margin: 10px;
  border: none;
  color: white;
  font-size: 14px;
  border-radius: 3px;
  outline: none;
  cursor: pointer;
  --btn-bg: #4768c4;
  --btn-hover: #486fdb;
  --btn-active: #324e99;

  background-color: var(--btn-bg);
}

.utilbutton:hover:not(:disabled) {
  background-color: var(--btn-hover);
  font-weight: bold;
}

.utilbutton:active:not(:disabled) {
  background-color: var(--btn-active);
  font-weight: bold;
}

.utilbutton:disabled {
  background-color: #bbb;
  color: #666;
  cursor: not-allowed;
  opacity: 0.6;
}

.utilbutton.green {
  --btn-bg: #4caf50;
  --btn-hover: #5fc963;
  --btn-active: #3d8b40;
}

.utilbutton.red {
  --btn-bg: #e74c3c;
  --btn-hover: #ff5c4d;
  --btn-active: #c0392b;
}

.utilbutton.orange {
  --btn-bg: #ff9a5c;
  --btn-hover: #ff914d;
  --btn-active: #ff6100;
}


/* Fake Button for File Input */
.fakeButton {
  display: inline-block;
  padding: 6px;
  border-radius: 3px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.3px;
  color: #fff;
  background-color: #ff9a5c;
  border: none;
  cursor: pointer;
}
